<h1>List des Conferences </h1>
<input type="text" [(ngModel)]="searchItem" placeholder="Search by conference">
<div class="container-fluid d-flex flex-wrap justify-content-center">
    @for (conf of filter(); track conf.id) {
        @if(conf.nbPlaces > 0) {
           <appcard [conf]="conf" (addToFavorites)="addToFavorites($event)" (addlike)="addlike($event)"></appcard>
        }
    }@empty {
        <h2>Pas de conferences  </h2>
    }
</div>
<div>
    <h1>list des favoris</h1>
    <ul>   
    @for (conf of favList(); track conf.id) {
     <li>{{conf.titre}}</li>
    }
    </ul>
</div>
